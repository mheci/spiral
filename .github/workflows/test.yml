name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and config validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q installer tests
      - name: Run unit tests
        env:
          PYTHONPATH: installer
        run: python -m unittest discover -s tests -t . -v
      - name: Validate repository configuration
        env:
          PYTHONPATH: installer
        run: |
          python - <<'PY'
          from spiral_installer.config import load_repository
          repo = load_repository()
          print(f"release suite: {repo.debian.suite}")
          print(f"filesystems: {', '.join(sorted(repo.profiles.filesystems))}")
          print(f"desktops: {', '.join(sorted(repo.profiles.desktops))}")
          print(f"kernel profiles: {', '.join(sorted(repo.profiles.kernels))}")
          print(f"package groups: {', '.join(sorted(repo.profiles.packages))}")
          PY
