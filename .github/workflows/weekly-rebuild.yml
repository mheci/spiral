name: weekly-rebuild

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  build:
    uses: $/.github/workflows/build.yml
    with:
      publish: true
      force_publish: false
